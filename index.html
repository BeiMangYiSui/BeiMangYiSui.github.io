<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北邙一穗</title>
<meta name="description" content="北邙无闲土，麦田有故人。">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #111;
  --fg: #ddd;
  --dim: #777;
  --accent: #c9a84c;
  --line: #2a2a2a;
}

body {
  font-family: -apple-system, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 680px;
  margin: 0 auto;
  padding: 0 1.5rem;
}

/* Header */
header {
  padding: 6rem 0 4rem;
}

header .avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 1.5rem;
  display: block;
}

header h1 {
  font-size: 1.75rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  margin-bottom: 0.25rem;
}

header .bio {
  font-size: 0.95rem;
  color: var(--dim);
}

/* Divider */
hr {
  border: none;
  border-top: 1px solid var(--line);
  margin: 0;
}

/* Works */
.works {
  padding: 3rem 0;
}

.works h2 {
  font-size: 0.8rem;
  font-weight: 400;
  color: var(--dim);
  letter-spacing: 0.15em;
  margin-bottom: 2rem;
}

.work-item {
  display: block;
  text-decoration: none;
  color: inherit;
  padding: 1.5rem 0;
  border-bottom: 1px solid var(--line);
  transition: opacity 0.2s;
}

.work-item:hover {
  opacity: 0.7;
}

.work-item .work-title {
  font-size: 1.15rem;
  font-weight: 600;
  margin-bottom: 0.3rem;
}

.work-item .work-title .status {
  font-size: 0.7rem;
  font-weight: 400;
  color: var(--accent);
  margin-left: 0.5rem;
  vertical-align: middle;
}

.work-item .work-desc {
  font-size: 0.9rem;
  color: var(--dim);
  line-height: 1.6;
}

/* Contact */
.contact {
  padding: 3rem 0 6rem;
}

.contact h2 {
  font-size: 0.8rem;
  font-weight: 400;
  color: var(--dim);
  letter-spacing: 0.15em;
  margin-bottom: 1.5rem;
}

.contact a {
  color: var(--fg);
  text-decoration: none;
  font-size: 0.9rem;
  margin-right: 2rem;
  border-bottom: 1px solid var(--line);
  padding-bottom: 1px;
  transition: border-color 0.2s;
}

.contact a:hover {
  border-color: var(--fg);
}

/* Footer */
footer {
  padding: 2rem 0;
  font-size: 0.75rem;
  color: #444;
}

@media (max-width: 600px) {
  header { padding: 4rem 0 3rem; }
}
</style>
</head>
<body>
<div class="container">

<header>
  <img class="avatar" src="avatar.jpg" alt="北邙一穗">
  <h1>北邙一穗</h1>
  <p class="bio">北邙无闲土，麦田有故人。</p>
</header>

<hr>

<section class="works">
  <h2>作品</h2>

  <a class="work-item" href="./qin-mie-liu-guo-demo/" target="_blank">
    <div class="work-title">秦灭六国 <span class="status">Demo</span></div>
    <div class="work-desc">历史已定，抉择在你。扮演秦军秘密行动头领北芒，与医者小满、剑士青翎共历战国末年。无等级、无装备、无刷怪——你决定的是方法与代价。浏览器即玩。</div>
  </a>

  <!-- 未来作品加在这里 -->
</section>

<hr>

<section class="contact">
  <h2>联系</h2>
  <a href="https://t.me/BEIMANGYISUI" target="_blank" rel="noopener">Telegram</a>
  <a href="https://github.com/shixiaofei-sunny" target="_blank" rel="noopener">GitHub</a>
</section>

<footer>
  © 2026 北邙一穗
</footer>

</div>
</body>
</html>
