<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北邙一穗</title>
<meta name="description" content="北邙无闲土，麦田有故人。">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f5f0e8;
  --card: #faf7f2;
  --fg: #2c2820;
  --dim: #8a8070;
  --accent: #9a7b2d;
  --line: #e0d8c8;
  --line-dark: #c8bfb0;
  --gold: #b8953f;
}

body {
  font-family: Georgia, 'Noto Serif SC', 'Songti SC', serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* 流动背景 */
.flow-bg {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: -1;
  opacity: 0.4;
}

.flow-bg canvas {
  width: 100%; height: 100%;
  display: block;
}

.container {
  max-width: 640px;
  margin: 0 auto;
  padding: 0 1.5rem;
  position: relative;
  z-index: 1;
}

/* Header */
header {
  padding: 7rem 0 4rem;
  position: relative;
}

header .avatar {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 2rem;
  display: block;
  border: 3px solid var(--line);
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  opacity: 0;
  transform: translateY(20px);
  animation: rise 1s ease 0.2s forwards;
}

header h1 {
  font-size: 2.2rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  margin-bottom: 0.4rem;
  color: var(--fg);
  opacity: 0;
  transform: translateY(20px);
  animation: rise 1s ease 0.4s forwards;
}

header .bio {
  font-size: 1.05rem;
  color: var(--dim);
  letter-spacing: 0.06em;
  margin-bottom: 0.8rem;
  opacity: 0;
  transform: translateY(20px);
  animation: rise 1s ease 0.6s forwards;
}

header .role {
  display: inline-block;
  font-size: 0.78rem;
  color: var(--accent);
  letter-spacing: 0.25em;
  padding: 0.3em 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  opacity: 0;
  transform: translateY(20px);
  animation: rise 1s ease 0.8s forwards;
}

@keyframes rise {
  to { opacity: 1; transform: translateY(0); }
}

/* Divider */
hr {
  border: none;
  border-top: 1px solid var(--line);
  opacity: 0;
  animation: fadeIn 1s ease 1s forwards;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* Works */
.works {
  padding: 4rem 0;
}

.works h2 {
  font-size: 0.75rem;
  font-weight: 400;
  color: var(--dim);
  letter-spacing: 0.3em;
  margin-bottom: 0.8rem;
  opacity: 0;
  animation: fadeIn 1s ease 1.2s forwards;
}

.works .works-sub {
  font-size: 0.85rem;
  color: var(--dim);
  margin-bottom: 2.5rem;
  opacity: 0;
  animation: fadeIn 1s ease 1.4s forwards;
}

.work-card {
  display: block;
  text-decoration: none;
  color: inherit;
  background: var(--card);
  border: 1px solid var(--line);
  overflow: hidden;
  transition: border-color 0.4s, box-shadow 0.4s, transform 0.4s;
  margin-bottom: 2rem;
  opacity: 0;
  transform: translateY(30px);
  animation: rise 1s ease 1.6s forwards;
}

.work-card:hover {
  border-color: var(--line-dark);
  box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  transform: translateY(-4px);
}

.work-card img {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  display: block;
  filter: brightness(0.95) saturate(0.9);
  transition: filter 0.5s, transform 0.5s;
}

.work-card:hover img {
  filter: brightness(1) saturate(1);
  transform: scale(1.02);
}

.work-card .work-body {
  padding: 1.8rem;
}

.work-card .work-title {
  font-size: 1.25rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
  letter-spacing: 0.03em;
}

.work-card .work-title .status {
  font-size: 0.68rem;
  font-weight: 400;
  color: var(--accent);
  margin-left: 0.6rem;
  letter-spacing: 0.15em;
  border: 1px solid var(--accent);
  padding: 0.15em 0.5em;
  vertical-align: middle;
  opacity: 0.8;
}

.work-card .work-desc {
  font-size: 0.88rem;
  color: var(--dim);
  line-height: 1.8;
  margin-bottom: 0.8rem;
}

.work-card .work-meta {
  display: flex;
  gap: 1rem;
  font-size: 0.75rem;
  color: var(--dim);
  opacity: 0.7;
  margin-bottom: 0.8rem;
}

.work-card .work-link {
  display: inline-block;
  font-size: 0.82rem;
  color: var(--accent);
  letter-spacing: 0.12em;
  border-bottom: 1px solid transparent;
  transition: border-color 0.3s;
}

.work-card:hover .work-link {
  border-bottom-color: var(--accent);
}

/* About */
.about {
  padding: 3rem 0;
  opacity: 0;
  animation: fadeIn 1s ease 2s forwards;
}

.about p {
  font-size: 0.92rem;
  color: var(--dim);
  line-height: 2;
  max-width: 480px;
}

/* Contact */
.contact {
  padding: 3rem 0 6rem;
  opacity: 0;
  animation: fadeIn 1s ease 2.2s forwards;
}

.contact h2 {
  font-size: 0.75rem;
  font-weight: 400;
  color: var(--dim);
  letter-spacing: 0.3em;
  margin-bottom: 1.5rem;
}

.contact a {
  color: var(--fg);
  text-decoration: none;
  font-size: 0.9rem;
  margin-right: 2.5rem;
  border-bottom: 1px solid var(--line);
  padding-bottom: 2px;
  transition: border-color 0.3s, color 0.3s;
}

.contact a:hover {
  border-color: var(--fg);
  color: var(--accent);
}

/* Footer */
footer {
  padding: 2rem 0;
  font-size: 0.7rem;
  color: #b0a890;
  letter-spacing: 0.12em;
  display: flex;
  justify-content: space-between;
  align-items: center;
  opacity: 0;
  animation: fadeIn 1s ease 2.4s forwards;
}

footer .footer-note {
  opacity: 0.6;
}

@media (max-width: 600px) {
  header { padding: 4.5rem 0 3rem; }
  header h1 { font-size: 1.8rem; }
  .works { padding: 3rem 0; }
  footer { flex-direction: column; gap: 0.5rem; text-align: center; }
}
</style>
</head>
<body>

<!-- 流动背景 -->
<div class="flow-bg">
  <canvas id="flowCanvas"></canvas>
</div>

<div class="container">

<header>
  <img class="avatar" src="avatar.jpg" alt="北邙一穗">
  <h1>北邙一穗</h1>
  <p class="bio">北邙无闲土，麦田有故人。</p>
  <span class="role">一个热爱历史的人</span>
</header>

<hr>

<section class="works">
  <h2>作品</h2>
  <p class="works-sub">一个人做的游戏，慢慢做，慢慢改。</p>

  <a class="work-card" href="./qin-mie-liu-guo-demo/" target="_blank">
    <img src="cover-qin.webp" alt="秦灭六国">
    <div class="work-body">
      <div class="work-title">秦灭六国 <span class="status">DEMO</span></div>
      <p class="work-desc">历史已定，抉择在你。扮演秦军秘密行动头领北芒，与医者小满、剑士青翎共历战国末年。无等级、无装备、无刷怪——你决定的是方法与代价。</p>
      <div class="work-meta">
        <span>叙事 RPG</span>
        <span>约 70 分钟</span>
        <span>浏览器即玩</span>
      </div>
      <span class="work-link">开始试玩 →</span>
    </div>
  </a>

  <!-- 未来作品加在这里 -->
</section>

<hr>

<section class="about">
  <p>北邙一穗，取"北邙无闲土"之意。白天写代码，晚上写故事。相信好的游戏不需要堆砌系统，一个让人记住的选择，比一百个装备栏更有分量。</p>
</section>

<hr>

<section class="contact">
  <h2>找到我</h2>
  <a href="https://t.me/BEIMANGYISUI" target="_blank" rel="noopener">Telegram</a>
  <a href="https://github.com/shixiaofei-sunny" target="_blank" rel="noopener">GitHub</a>
</section>

<footer>
  <span>© 2026 北邙一穗</span>
  <span class="footer-note">手工制作，无模板</span>
</footer>

</div>

<script>
// 流动背景 - 像水波一样缓慢流动的线条
(function() {
  const canvas = document.getElementById('flowCanvas');
  const ctx = canvas.getContext('2d');
  
  let w, h;
  let time = 0;
  
  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  
  window.addEventListener('resize', resize);
  resize();
  
  // 生成流动的波浪线
  function drawWave(yOffset, amplitude, frequency, speed, color, lineWidth) {
    ctx.beginPath();
    for (let x = 0; x <= w; x += 3) {
      const y = yOffset + 
        Math.sin(x * frequency + time * speed) * amplitude +
        Math.sin(x * frequency * 0.5 + time * speed * 0.7) * amplitude * 0.5;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.stroke();
  }
  
  function animate() {
    ctx.clearRect(0, 0, w, h);
    time += 0.008;
    
    // 多层波浪，营造流动感
    drawWave(h * 0.3, 30, 0.003, 1, 'rgba(154, 123, 45, 0.06)', 1);
    drawWave(h * 0.35, 40, 0.002, 0.8, 'rgba(154, 123, 45, 0.04)', 1.5);
    drawWave(h * 0.5, 50, 0.0025, 0.6, 'rgba(138, 128, 112, 0.05)', 1);
    drawWave(h * 0.55, 35, 0.003, 0.9, 'rgba(154, 123, 45, 0.03)', 2);
    drawWave(h * 0.7, 45, 0.002, 0.7, 'rgba(138, 128, 112, 0.04)', 1);
    drawWave(h * 0.75, 25, 0.004, 1.1, 'rgba(154, 123, 45, 0.05)', 1);
    
    requestAnimationFrame(animate);
  }
  
  animate();
})();
</script>

</body>
</html>
