<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北邙一穗</title>
<meta name="description" content="北邙无闲土，麦田有故人。">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f5f0e8;
  --card: #faf7f2;
  --fg: #2c2820;
  --dim: #5a544a;
  --accent: #9a7b2d;
  --line: #e0d8c8;
  --line-dark: #c8bfb0;
}

body {
  font-family: Georgia, 'Noto Serif SC', 'Songti SC', serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* 流动背景 - 纯CSS实现 */
.flow-bg {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: -1;
  overflow: hidden;
}

.flow-wave {
  position: absolute;
  width: 200%;
  height: 200%;
  top: -50%;
  left: -50%;
  background: 
    radial-gradient(ellipse at 30% 40%, rgba(154,123,45,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 60%, rgba(138,128,112,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(154,123,45,0.05) 0%, transparent 40%);
  animation: flow 20s ease-in-out infinite;
}

.flow-wave:nth-child(2) {
  animation-delay: -7s;
  animation-duration: 25s;
  opacity: 0.6;
}

.flow-wave:nth-child(3) {
  animation-delay: -14s;
  animation-duration: 30s;
  opacity: 0.4;
}

@keyframes flow {
  0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
  25% { transform: translate(2%, 3%) rotate(1deg) scale(1.02); }
  50% { transform: translate(-1%, 2%) rotate(-1deg) scale(0.98); }
  75% { transform: translate(3%, -1%) rotate(0.5deg) scale(1.01); }
}

/* 麦浪线条 */
.wheat-lines {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: -1;
  opacity: 0.15;
}

.wheat-line {
  position: absolute;
  width: 200%;
  height: 1px;
  background: linear-gradient(90deg, 
    transparent 0%, 
    var(--accent) 20%, 
    var(--accent) 80%, 
    transparent 100%);
  animation: wave 8s ease-in-out infinite;
}

.wheat-line:nth-child(1) { top: 20%; animation-delay: 0s; }
.wheat-line:nth-child(2) { top: 35%; animation-delay: -2s; opacity: 0.7; }
.wheat-line:nth-child(3) { top: 50%; animation-delay: -4s; opacity: 0.5; }
.wheat-line:nth-child(4) { top: 65%; animation-delay: -1s; opacity: 0.8; }
.wheat-line:nth-child(5) { top: 80%; animation-delay: -3s; opacity: 0.6; }

@keyframes wave {
  0%, 100% { transform: translateX(-5%) scaleY(1); opacity: 0.3; }
  50% { transform: translateX(5%) scaleY(1.5); opacity: 0.8; }
}

.container {
  max-width: 640px;
  margin: 0 auto;
  padding: 0 1.5rem;
  position: relative;
  z-index: 1;
}

/* Header */
header {
  padding: 7rem 0 4rem;
  position: relative;
}

header .avatar {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 2rem;
  display: block;
  border: 3px solid var(--line);
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  opacity: 0;
  transform: translateY(20px);
  animation: rise 1s ease 0.2s forwards;
}

header h1 {
  font-size: 2.2rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  margin-bottom: 0.4rem;
  color: var(--fg);
  opacity: 0;
  transform: translateY(20px);
  animation: rise 1s ease 0.4s forwards;
}

header .bio {
  font-size: 1.05rem;
  color: var(--dim);
  letter-spacing: 0.06em;
  margin-bottom: 0.8rem;
  opacity: 0;
  transform: translateY(20px);
  animation: rise 1s ease 0.6s forwards;
}

header .role {
  display: inline-block;
  font-size: 0.78rem;
  color: var(--accent);
  letter-spacing: 0.25em;
  padding: 0.3em 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  opacity: 0;
  transform: translateY(20px);
  animation: rise 1s ease 0.8s forwards;
}

@keyframes rise {
  to { opacity: 1; transform: translateY(0); }
}

/* Divider */
hr {
  border: none;
  border-top: 1px solid var(--line);
  opacity: 0;
  animation: fadeIn 1s ease 1s forwards;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* Works */
.works {
  padding: 4rem 0;
}

.works h2 {
  font-size: 0.75rem;
  font-weight: 400;
  color: var(--dim);
  letter-spacing: 0.3em;
  margin-bottom: 0.8rem;
  opacity: 0;
  animation: fadeIn 1s ease 1.2s forwards;
}

.works .works-sub {
  font-size: 0.85rem;
  color: var(--dim);
  margin-bottom: 2.5rem;
  opacity: 0;
  animation: fadeIn 1s ease 1.4s forwards;
}

.work-card {
  display: block;
  text-decoration: none;
  color: inherit;
  background: var(--card);
  border: 1px solid var(--line);
  overflow: hidden;
  transition: border-color 0.4s, box-shadow 0.4s, transform 0.4s;
  margin-bottom: 2rem;
  opacity: 0;
  transform: translateY(30px);
  animation: rise 1s ease 1.6s forwards;
}

.work-card:hover {
  border-color: var(--line-dark);
  box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  transform: translateY(-4px);
}

.work-card img {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  display: block;
  filter: brightness(0.95) saturate(0.9);
  transition: filter 0.5s, transform 0.5s;
}

.work-card:hover img {
  filter: brightness(1) saturate(1);
  transform: scale(1.02);
}

.work-card .work-body {
  padding: 1.8rem;
}

.work-card .work-title {
  font-size: 1.25rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
  letter-spacing: 0.03em;
}

.work-card .work-title .status {
  font-size: 0.68rem;
  font-weight: 400;
  color: var(--accent);
  margin-left: 0.6rem;
  letter-spacing: 0.15em;
  border: 1px solid var(--accent);
  padding: 0.15em 0.5em;
  vertical-align: middle;
  opacity: 0.8;
}

.work-card .work-desc {
  font-size: 0.88rem;
  color: var(--dim);
  line-height: 1.8;
  margin-bottom: 0.8rem;
}

.work-card .work-meta {
  display: flex;
  gap: 1rem;
  font-size: 0.75rem;
  color: var(--dim);
  opacity: 0.7;
  margin-bottom: 0.8rem;
}

.work-card .work-link {
  display: inline-block;
  font-size: 0.82rem;
  color: var(--accent);
  letter-spacing: 0.12em;
  border-bottom: 1px solid transparent;
  transition: border-color 0.3s;
}

.work-card:hover .work-link {
  border-bottom-color: var(--accent);
}

/* About */
.about {
  padding: 3rem 0;
  opacity: 0;
  animation: fadeIn 1s ease 2s forwards;
}

.about p {
  font-size: 0.92rem;
  color: var(--dim);
  line-height: 2;
  max-width: 480px;
}

/* Contact */
.contact {
  padding: 3rem 0 6rem;
  opacity: 0;
  animation: fadeIn 1s ease 2.2s forwards;
}

.contact h2 {
  font-size: 0.75rem;
  font-weight: 400;
  color: var(--dim);
  letter-spacing: 0.3em;
  margin-bottom: 1.5rem;
}

.contact a {
  color: var(--fg);
  text-decoration: none;
  font-size: 0.9rem;
  margin-right: 2.5rem;
  border-bottom: 1px solid var(--line);
  padding-bottom: 2px;
  transition: border-color 0.3s, color 0.3s;
}

.contact a:hover {
  border-color: var(--fg);
  color: var(--accent);
}

/* Footer */
footer {
  padding: 2rem 0;
  font-size: 0.7rem;
  color: #b0a890;
  letter-spacing: 0.12em;
  display: flex;
  justify-content: space-between;
  align-items: center;
  opacity: 0;
  animation: fadeIn 1s ease 2.4s forwards;
}

footer .footer-note {
  opacity: 0.6;
}

@media (max-width: 600px) {
  header { padding: 4.5rem 0 3rem; }
  header h1 { font-size: 1.8rem; }
  .works { padding: 3rem 0; }
  footer { flex-direction: column; gap: 0.5rem; text-align: center; }
}
</style>
