<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北邙一穗 · 独立游戏开发者</title>
<meta name="description" content="北邙无闲土，麦田有故人。独立游戏开发者作品集。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --wheat: #c9a84c;
  --wheat-light: #e8d48b;
  --wheat-dim: #8b7332;
  --earth: #1a1610;
  --earth-mid: #2a2318;
  --earth-light: #3d3425;
  --parchment: #f0e6d0;
  --parchment-dim: #a89878;
  --ink: #0d0b08;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Serif SC', serif;
  background: var(--earth);
  color: var(--parchment);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.8;
}

/* Ambient grain texture overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
}

/* Hero section */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4rem 2rem;
  overflow: hidden;
}

.hero-bg {
  position: absolute;
  inset: 0;
  background: url('avatar.jpg') center/cover no-repeat;
  filter: brightness(0.3) saturate(0.7);
  transform: scale(1.05);
  animation: heroBreath 20s ease-in-out infinite alternate;
}

@keyframes heroBreath {
  from { transform: scale(1.05); }
  to { transform: scale(1.12); }
}

.hero-bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(26, 22, 16, 0.4) 0%,
    rgba(26, 22, 16, 0.6) 50%,
    rgba(26, 22, 16, 0.95) 100%
  );
}

.hero-content {
  position: relative;
  z-index: 2;
  text-align: center;
  animation: fadeUp 1.2s ease-out;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.avatar-frame {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  margin: 0 auto 2rem;
  position: relative;
  animation: float 6s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.avatar-frame::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, var(--wheat), var(--wheat-dim), var(--wheat-light), var(--wheat));
  animation: spin 8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.avatar-frame img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  position: relative;
  z-index: 1;
  border: 3px solid var(--earth);
}

.hero-name {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  color: var(--wheat-light);
  letter-spacing: 0.15em;
  margin-bottom: 0.5rem;
  text-shadow: 0 2px 20px rgba(201, 168, 76, 0.3);
}

.hero-bio {
  font-size: clamp(1rem, 2.5vw, 1.3rem);
  color: var(--parchment-dim);
  letter-spacing: 0.3em;
  font-style: italic;
  margin-bottom: 2.5rem;
}

.hero-tagline {
  font-size: 0.85rem;
  color: var(--wheat-dim);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  border: 1px solid var(--wheat-dim);
  padding: 0.4em 1.5em;
  display: inline-block;
}

.scroll-hint {
  position: absolute;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  animation: bounce 2s ease-in-out infinite;
  color: var(--wheat-dim);
  font-size: 0.75rem;
  letter-spacing: 0.2em;
  text-align: center;
}

.scroll-hint::after {
  content: '';
  display: block;
  width: 1px;
  height: 30px;
  background: linear-gradient(to bottom, var(--wheat-dim), transparent);
  margin: 0.5rem auto 0;
}

@keyframes bounce {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(8px); }
}

/* Works section */
.works {
  padding: 6rem 2rem;
  max-width: 1100px;
  margin: 0 auto;
}

.section-label {
  font-size: 0.75rem;
  letter-spacing: 0.4em;
  color: var(--wheat-dim);
  text-transform: uppercase;
  margin-bottom: 1rem;
  padding-left: 0.5rem;
  border-left: 2px solid var(--wheat-dim);
}

.section-title {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  color: var(--parchment);
  margin-bottom: 3rem;
}

.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 2rem;
}

.game-card {
  position: relative;
  background: var(--earth-mid);
  border: 1px solid var(--earth-light);
  border-radius: 2px;
  overflow: hidden;
  transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  display: block;
}

.game-card:hover {
  transform: translateY(-4px);
  border-color: var(--wheat-dim);
  box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px var(--wheat-dim);
}

.game-card-cover {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  transition: transform 0.6s ease;
  filter: brightness(0.85);
}

.game-card:hover .game-card-cover {
  transform: scale(1.05);
  filter: brightness(1);
}

.game-card-body {
  padding: 1.5rem;
}

.game-card-title {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 1.4rem;
  color: var(--wheat-light);
  margin-bottom: 0.5rem;
}

.game-card-desc {
  font-size: 0.9rem;
  color: var(--parchment-dim);
  line-height: 1.6;
  margin-bottom: 1rem;
}

.game-card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.game-card-tag {
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  color: var(--wheat-dim);
  border: 1px solid var(--earth-light);
  padding: 0.2em 0.7em;
  border-radius: 1px;
}

.game-card-status {
  position: absolute;
  top: 1rem;
  right: 1rem;
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  padding: 0.3em 0.8em;
  background: rgba(26, 22, 16, 0.85);
  border: 1px solid var(--wheat-dim);
  color: var(--wheat);
  backdrop-filter: blur(4px);
}

.game-card-play {
  display: inline-flex;
  align-items: center;
  gap: 0.4em;
  font-size: 0.8rem;
  color: var(--wheat);
  letter-spacing: 0.1em;
  margin-top: 0.8rem;
  transition: gap 0.3s ease;
}

.game-card:hover .game-card-play {
  gap: 0.8em;
}

/* Contact section */
.contact {
  padding: 4rem 2rem 6rem;
  max-width: 1100px;
  margin: 0 auto;
  text-align: center;
}

.contact-links {
  display: flex;
  justify-content: center;
  gap: 2rem;
  flex-wrap: wrap;
  margin-top: 2rem;
}

.contact-link {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--parchment-dim);
  text-decoration: none;
  font-size: 0.9rem;
  letter-spacing: 0.1em;
  padding: 0.6em 1.2em;
  border: 1px solid var(--earth-light);
  transition: all 0.3s ease;
}

.contact-link:hover {
  color: var(--wheat);
  border-color: var(--wheat-dim);
  background: rgba(201, 168, 76, 0.05);
}

.contact-link svg {
  width: 18px;
  height: 18px;
}

/* Footer */
footer {
  text-align: center;
  padding: 2rem;
  font-size: 0.7rem;
  color: var(--earth-light);
  letter-spacing: 0.2em;
  border-top: 1px solid var(--earth-light);
}

/* Scroll reveal */
.reveal {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.8s ease, transform 0.8s ease;
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

/* Responsive */
@media (max-width: 600px) {
  .game-grid { grid-template-columns: 1fr; }
  .hero { padding: 3rem 1.5rem; }
  .works { padding: 4rem 1.5rem; }
}
</style>
</head>
<body>

<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-content">
    <div class="avatar-frame">
      <img src="avatar.jpg" alt="北邙一穗">
    </div>

</section>

<footer>
  © 2026 北邙一穗 · 独立游戏开发
</footer>

<script>
// Scroll reveal
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
    }
  });
}, { threshold: 0.1 });

document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>
</body>
</html>
