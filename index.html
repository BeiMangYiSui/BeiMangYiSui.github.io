<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北邙一穗</title>
<meta name="description" content="北邙无闲土，麦田有故人。">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f5f0e8;
  --card: #faf7f2;
  --fg: #2c2820;
  --dim: #8a8070;
  --accent: #9a7b2d;
  --line: #e0d8c8;
}

body {
  font-family: Georgia, 'Noto Serif SC', 'Songti SC', serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 640px;
  margin: 0 auto;
  padding: 0 1.5rem;
}

/* Header */
header {
  padding: 8rem 0 5rem;
}

header .avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 2rem;
  display: block;
  border: 2px solid var(--line);
}

header h1 {
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  margin-bottom: 0.5rem;
  color: var(--fg);
}

header .bio {
  font-size: 1rem;
  color: var(--dim);
  letter-spacing: 0.05em;
}

header .role {
  display: inline-block;
  margin-top: 1.2rem;
  font-size: 0.8rem;
  color: var(--accent);
  letter-spacing: 0.2em;
}

/* Divider */
hr {
  border: none;
  border-top: 1px solid var(--line);
}

/* Works */
.works {
  padding: 4rem 0;
}

.works h2 {
  font-size: 0.75rem;
  font-weight: 400;
  color: var(--dim);
  letter-spacing: 0.25em;
  margin-bottom: 2.5rem;
}

.work-card {
  display: block;
  text-decoration: none;
  color: inherit;
  background: var(--card);
  border: 1px solid var(--line);
  overflow: hidden;
  transition: border-color 0.3s;
}

.work-card:hover {
  border-color: #c8bfb0;
}

.work-card img {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  display: block;
  filter: brightness(0.95);
  transition: filter 0.3s;
}

.work-card:hover img {
  filter: brightness(1);
}

.work-card .work-body {
  padding: 1.5rem;
}

.work-card .work-title {
  font-size: 1.2rem;
  font-weight: 600;
  margin-bottom: 0.4rem;
}

.work-card .work-title .status {
  font-size: 0.7rem;
  font-weight: 400;
  color: var(--accent);
  margin-left: 0.6rem;
  letter-spacing: 0.1em;
}

.work-card .work-desc {
  font-size: 0.88rem;
  color: var(--dim);
  line-height: 1.7;
}

.work-card .work-link {
  display: inline-block;
  margin-top: 0.8rem;
  font-size: 0.8rem;
  color: var(--accent);
  letter-spacing: 0.1em;
}

/* Contact */
.contact {
  padding: 3rem 0 6rem;
}

.contact h2 {
  font-size: 0.75rem;
  font-weight: 400;
  color: var(--dim);
  letter-spacing: 0.25em;
  margin-bottom: 1.5rem;
}

.contact a {
  color: var(--fg);
  text-decoration: none;
  font-size: 0.9rem;
  margin-right: 2rem;
  border-bottom: 1px solid var(--line);
  padding-bottom: 2px;
  transition: border-color 0.2s;
}

.contact a:hover {
  border-color: var(--fg);
}

/* Footer */
footer {
  padding: 2rem 0;
  font-size: 0.7rem;
  color: #b0a890;
  letter-spacing: 0.1em;
}

@media (max-width: 600px) {
  header { padding: 5rem 0 3.5rem; }
  .works { padding: 3rem 0; }
}
</style>
</head>
<body>
<div class="container">

<header>
  <img class="avatar" src="avatar.jpg" alt="北邙一穗">
  <h1>北邙一穗</h1>
  <p class="bio">北邙无闲土，麦田有故人。</p>
  <span class="role">做游戏的人</span>
</header>

<hr>

<section class="works">
  <h2>作品</h2>

  <a class="work-card" href="./qin-mie-liu-guo-demo/" target="_blank">
    <img src="cover-qin.webp" alt="秦灭六国">
    <div class="work-body">
      <div class="work-title">秦灭六国 <span class="status">DEMO</span></div>
      <p class="work-desc">历史已定，抉择在你。扮演秦军秘密行动头领北芒，与医者小满、剑士青翎共历战国末年。无等级、无装备、无刷怪——你决定的是方法与代价。</p>
      <span class="work-link">浏览器即玩 →</span>
    </div>
  </a>

  <!-- 未来作品加在这里 -->
</section>

<hr>

<section class="contact">
  <h2>找到我</h2>
  <a href="https://t.me/BEIMANGYISUI" target="_blank" rel="noopener">Telegram</a>
  <a href="https://github.com/shixiaofei-sunny" target="_blank" rel="noopener">GitHub</a>
</section>

<footer>
  © 2026 北邙一穗
</footer>

</div>
</body>
</html>
